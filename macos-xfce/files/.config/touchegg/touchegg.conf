<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">5</property>
  </settings>
  <application name="All">
    <!-- 3-finger swipe right/left: next/previous desktop -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/desktop-switch prev</command>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/desktop-switch next</command>
        <on>begin</on>
      </action>
    </gesture>
    <!-- 3-finger swipe up / down: Mission Control open / closed, like macOS -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/mission-control --open</command>
        <on>begin</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/mission-control --close</command>
        <on>begin</on>
      </action>
    </gesture>
    <!-- spread thumb and three fingers: show desktop (pinch them back: windows return), like macOS -->
    <gesture type="PINCH" fingers="4" direction="OUT">
      <action type="SHOW_DESKTOP">
        <animate>false</animate>
      </action>
    </gesture>
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="SHOW_DESKTOP">
        <animate>false</animate>
      </action>
    </gesture>
  </application>
</touchégg>

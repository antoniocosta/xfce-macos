# picom v13 (~/.local/bin/picom): a macOS-like slide when switching desktops.
# desktop-switch marks windows with _MAC_SLIDE = "fwd"/"back" just before switching;
# these rules slide them a whole screen width. Everything else is instant (no fades).
# Toggle with `desktop-slide on|off`; off restores xfwm4's own compositor.

backend = "glx";
vsync = false;            # measured: vsync on cost ~4% more CPU here; off can tear slightly during the slide
use-damage = true;
unredir-if-possible = true;   # fullscreen video/games bypass picom
fading = false;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -8;

rules = (
  # no shadows on the dock, panel, desktop, notifications, launcher and Mission Control
  { match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'notification' || "
            "window_type = 'tooltip' || window_type = 'dnd' || class_g = 'Plank' || "
            "class_g = 'Xfce4-panel' || class_g = 'Rofi' || name *= 'skippy-xd' || _GTK_FRAME_EXTENTS@";
    shadow = false; },

  # forward: the old desktop leaves to the left, the new one comes in from the right
  { match = "_MAC_SLIDE@ = 'fwd'";
    animations = (
      { triggers = ["hide"];
        opacity = 1; shadow-opacity = 1;
        offset-x = { curve = "cubic-bezier(0.25, 0.8, 0.3, 1)"; duration = 0.35; start = 0; end = "-window-monitor-width"; };
        shadow-offset-x = "offset-x"; },
      { triggers = ["show"];
        offset-x = { curve = "cubic-bezier(0.25, 0.8, 0.3, 1)"; duration = 0.35; start = "window-monitor-width"; end = 0; };
        shadow-offset-x = "offset-x"; }
    ); },

  # back: the old desktop leaves to the right, the new one comes in from the left
  { match = "_MAC_SLIDE@ = 'back'";
    animations = (
      { triggers = ["hide"];
        opacity = 1; shadow-opacity = 1;
        offset-x = { curve = "cubic-bezier(0.25, 0.8, 0.3, 1)"; duration = 0.35; start = 0; end = "window-monitor-width"; };
        shadow-offset-x = "offset-x"; },
      { triggers = ["show"];
        offset-x = { curve = "cubic-bezier(0.25, 0.8, 0.3, 1)"; duration = 0.35; start = "-window-monitor-width"; end = 0; };
        shadow-offset-x = "offset-x"; }
    ); }
);
